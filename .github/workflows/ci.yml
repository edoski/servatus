name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run vulture
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import servatus"
      - run: uv run --isolated --no-project --with dist/*.whl servatus --help
      - run: uv run --isolated --no-project --with dist/*.whl python -m servatus --help
